site_name: JLU 規則書｜DC 超級英雄 TRPG 中文規則
site_url: https://jlurulebook.com/
site_description: DC 超級英雄主題 TRPG 的中文翻譯規則書，包含角色創建、超能力、戰鬥判定與專有名詞對照，供跑團玩家與 GM 查閱。

theme:
  name: material
  logo: assets/logo.png      # 網頁左上角的 Logo
  favicon: assets/logo.png   # 瀏覽器分頁的小圖標
  language: zh-TW # 設定語言為繁體中文
  font:
    text: Noto Sans TC
    code: JetBrains Mono
  features:
    - navigation.tabs # 在畫面上方加入導航頁籤
    - navigation.instant
    - navigation.top # 加入「回到最上方」按鈕
    - navigation.sections
    - navigation.footer
    - search.highlight
    - search.suggest # 搜尋關鍵字建議
    - content.tabs.link
  palette:
    # 淺色模式設定
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo # 頂部導航列顏色 (深藍)
      accent: blue    # 連結與按鈕顏色
      toggle:
        icon: material/weather-night
        name: 切換至深色模式
    # 深色模式設定
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切換至淺色模式

nav:
  - 首頁: index.md
  - 導論與核心概念: intro.md
  - 劇情點與編輯點與危機骰: story-points.md
  - 角色創建:
      - 位階、PAX與屬性: character/rank-pax-attributes.md
      - 出身: character/origins.md
      - 原型: character/archetypes.md
  - 知識、特質與限制:
      - 知識: traits/knowledge.md
      - 特質: traits/qualities.md
      - 限制: traits/limitations.md
  - 能力與裝備:
      - 能力總則: abilities/overview.md
      - 武術訓練: abilities/martial-arts.md
      - 超能力: abilities/powers.md
      - 科技: abilities/technology.md
      - 裝備: abilities/equipment.md
  - 戰鬥與判定:
      - 檢定與戰鬥基礎: combat/basics.md
      - 狀態、移動與戰鬥動作: combat/actions.md
  - 威脅與反派: threats-villains.md
  - 專有名詞對應表: glossary.md

plugins:
  - search:
      lang: zh
      jieba_dict_user: includes/jieba-dict.txt # 讓「危機骰」等術語不被拆開
  - redirects:
      redirect_maps:
        JLU_譯文_01_導論與核心概念.md: intro.md
        JLU_譯文_02_劇情點與編輯點與危機骰.md: story-points.md
        JLU_譯文_03_角色創建_位階PAX屬性.md: character/rank-pax-attributes.md
        JLU_譯文_04_出身.md: character/origins.md
        JLU_譯文_04_原型.md: character/archetypes.md
        JLU_譯文_07b_知識.md: traits/knowledge.md
        JLU_譯文_07d_特質.md: traits/qualities.md
        JLU_譯文_07e_限制.md: traits/limitations.md
        JLU_譯文_05a_能力總則.md: abilities/overview.md
        JLU_譯文_05b_武術訓練.md: abilities/martial-arts.md
        JLU_譯文_06_超能力.md: abilities/powers.md
        JLU_譯文_07a_科技.md: abilities/technology.md
        JLU_譯文_07c_裝備.md: abilities/equipment.md
        JLU_譯文_08_檢定與戰鬥基礎.md: combat/basics.md
        JLU_譯文_09_狀態移動與戰鬥動作.md: combat/actions.md
        jlu威脅與反派.md: threats-villains.md
        JLU_專有名詞對應表_v2.md: glossary.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - nl2br # 保留：譯文依賴單行換行
  - pymdownx.details
  - pymdownx.snippets:
      auto_append:
        - includes/glossary-abbr.md
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
